name: apply zero-secret relay patch

on:
  push:
    branches: ["codex/streamlit-relay-zero-secret"]
    paths:
      - "scripts/apply_zero_secret_patch.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/streamlit-relay-zero-secret
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/apply_zero_secret_patch.py
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check app.py src tests relay
      - run: npm test --prefix relay/cloudflare-worker
      - name: Commit patched backend and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/building_hub.py tests/test_building_hub.py
          git diff --cached --check
          git commit -m "Allow relay URL without extra Streamlit secret"
          git push
